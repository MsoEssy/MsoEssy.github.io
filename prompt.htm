<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Checker</title>
</head>
<body>

    <a href="#">Age Prompt Demo</a>

    <script>
        let age = prompt("Enter your age:");

        // Convert input to number
        age = Number(age);

        if (age >= 18) {
            alert("Adult");
        } else if (age > 0) {
            alert("Minor");
        } else {
            alert("Invalid input");
        }
    </script>

</body>
</html>
